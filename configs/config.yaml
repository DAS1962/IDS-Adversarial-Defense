# Reproduction fidele de Awad et al. (2025), Sci Rep 15:14177.
# On suit leur protocole meme quand il est discutable. Les ecarts avec la
# branche main sont notes ici.

seed: 42

paths:
  raw: "data/raw"
  processed: "data/processed"
  checkpoints: "results/checkpoints"
  logs: "results/logs"
  attacks: "results/attacks"
  figures: "results/figures"

dataset:
  num_classes: 15
  num_features: 58

  # Ordre de la Figure 2 : nettoyage, echelle, equilibrage, selection, split.
  # Les trois operations qui dependent des donnees arrivent AVANT le split,
  # donc il y a fuite. C'est leur protocole, on le reproduit.

  # Le papier ne parle pas de doublons. On ne les retire pas.
  drop_duplicates: false

  # "scaling to limit the values between 0,1"
  scaler: "MinMaxScaler"
  clip_values: [0.0, 1.0]

  # "selecting 50% only of each class member except those containing less
  # than 2000 instances they are taken entirely"
  balance_fraction: 0.5
  balance_min_instances: 2000

  test_size: 0.33
  # Le papier n'a pas de set de validation (validation_split 0.33 dans Keras,
  # pris sur le train). On en fait un vrai pour choisir les hyperparametres
  # qu'ils ne documentent pas.
  val_size: 0.05

feature_selection:
  # Ils gardent les features NON fonctionnelles et retirent les plus
  # importantes, pour qu'un attaquant puisse perturber sans casser le trafic.
  # C'est l'inverse de ce qu'on a fait sur main.
  mode: "ert"          # "ert" = leur methode, "figure3" = leur liste exacte
  n_estimators: 100
  n_remove: 20

  # Les 20 features de leur Figure 3, transcrites du PDF. Utilise seulement
  # si mode = figure3. Les noms viennent de leur graphique, en minuscules ;
  # la correspondance vers les vrais noms du CSV est faite dans le script.
  figure3:
    - psh_flag_count
    - destination_port
    - min_seg_size_forward
    - bwd_packet_length_mean
    - packet_length_std
    - bwd_packet_length_std
    - average_packet_size
    - bwd_packet_length_min
    - init_win_bytes_forward
    - ack_flag_count
    - bwd_packet_length_max
    - avg_bwd_segment_size
    - fwd_iat_max
    - idle_min
    - packet_length_mean
    - idle_mean
    - flow_iat_max
    - max_packet_length
    - packet_length_variance
    - idle_max

# Table 3
model:
  hidden_layers: [512, 256]
  learning_rate: 0.01
  epochs: 30
  batch_size: 128

  # Le lr 0.01 du papier ne converge pas : val_acc atteint 0.9664 des
  # l'epoch 3 puis oscille entre 0.943 et 0.970 pendant 27 epochs. On avait
  # le meme comportement sur main. La variante baisse le lr et ajoute un
  # scheduler, tout le reste identique, pour isoler l'effet.
  variante_lr:
    active: false
    learning_rate: 0.001
    # 30 epochs ne suffisent pas : le meilleur etait le 29e sur 30, val_loss
    # descendait encore et le scheduler venait de passer son 2e palier.
    # A 100, le meilleur etait le 93e : il restait encore de la marge, d'ou
    # cette serie a 150.
    epochs: 150
    scheduler:
      factor: 0.5
      patience: 3
      min_lr: 1.0e-5

substitute:
  hidden_layers: [100, 100]
  learning_rate: 0.01
  epochs: 30
  batch_size: 256
  f1_cible: 0.98

# Table 2
attacks:
  FGSM:
    eps: 0.2
  BIM:
    eps: 0.3
    alpha: 0.01
    steps: 100
  PGD:
    eps: 0.3
    alpha: 0.01
    steps: 100
  DeepFool:
    epsilon: 1.0e-6
    max_iter: 100
  JSMA:
    theta: 0.1
    gamma: 1.0
  CW:
    max_iter: 9
    confidence: 0.0
    binary_search_steps: 10
    initial_const: 0.01
    learning_rate: 0.01

evaluation:
  # "From the testing data set we select 20,000 samples (5000 for each attack)"
  # Ils ne disent pas combien de benin. On prend 50/50 par symetrie avec
  # l'entrainement, ou c'est explicite.
  scope: "sample"      # "sample" = 20000 comme eux, "full" = tout le test
  n_samples: 20000
  benign_fraction: 0.5
  batch_size: 512

# Leurs quatre defenses. Les valeurs non documentees sont marquees.
defenses:
  LabelSmoothing:
    alpha: 0.1              # non documente
  GaussianAugmentation:
    # Non documente par le papier. Sur main, sigma 0.02 fonctionnait avec un
    # ecart-type moyen de 0.103, soit un bruit a 19 % du signal. Ici les
    # features non fonctionnelles ont un ecart-type de 0.0537, donc le meme
    # sigma represente 37 % du signal : le modele plafonne a 88 % de val_acc
    # et rejette 95 % du trafic legitime sous JSMA. sigma 0.01 retablit le
    # rapport de 19 %.
    sigma: 0.01
  AdversarialTraining:
    # Algorithme 3 : les quatre attaques pre-generees
    attacks: ["fgsm", "bim", "deepfool", "jsma"]
  DenoisingAutoencoder:
    hidden_dim: 32          # non documente
    l1_reg: 1.0e-4          # non documente
    clean_ratio: 0.5
